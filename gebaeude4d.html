<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="4deep-werkstatt" content="1">
<title>Gebäude-Werkstatt · 4Deep</title>
<!-- Gebäude-Werkstatt (Version 63, Prototyp, Wunsch des Nutzers): Adresse eines Gebäudes von Hand eingeben, Umriss und Höhe aus OpenStreetMap (Dienst Nominatim),
     schematisches 3D-Gebäude prüfen und als kleine Beschreibung speichern (*.4deep-gebaeude.json). 4Deep zeigt sie in der Firmen-Skyline auf dem Turm der Firma.
     Nur die eingegebene Adresse geht an Nominatim, keine Firmenliste. Daten © OpenStreetMap-Mitwirkende (ODbL). Läuft auch lokal per Doppelklick (three.min.js im selben Ordner). -->
<style>
:root{--bg:#0d1424;--pn:#16213a;--rand:#2b3a5c;--tx:#e8eefb;--mu:#9aa8c4;--ak:#4b8cff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#cfdcee;font:14px system-ui,sans-serif;color:var(--tx)}
#pn{position:fixed;left:10px;top:10px;bottom:10px;width:330px;background:rgba(13,20,36,.94);border-radius:10px;padding:14px;overflow:auto;z-index:2}
#pn h1{font-size:17px;margin:0 0 2px}#pn .m{color:var(--mu);font-size:12px}
label{display:block;margin:12px 0 4px;color:var(--mu);font-size:12px}
input,select,button{width:100%;padding:7px;background:var(--pn);color:var(--tx);border:1px solid var(--rand);border-radius:6px;font:inherit}
button{cursor:pointer;margin-top:6px}button:hover{border-color:var(--ak)}button:disabled{opacity:.45;cursor:default}
button.haupt{background:#2f63c8;border-color:#2f63c8;font-weight:600}
.zeile{display:flex;gap:6px}.zeile>*{flex:1}
#treffer button{text-align:left;font-size:12.5px;line-height:1.35}#treffer button.an{border-color:var(--ak);background:#1d2f57}
#st{margin-top:12px;font-size:12.5px;color:var(--mu);min-height:1.4em}#st.fehler{color:#ff8a80}
#info{font-size:12.5px;color:var(--mu);margin-top:8px;line-height:1.45}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#plan{position:fixed;right:12px;top:12px;width:260px;height:260px;background:rgba(255,255,255,.85);border-radius:10px;border:1px solid #b9c8de}
#osm{position:fixed;right:12px;bottom:10px;font-size:12px;color:#2a3b5c;background:rgba(255,255,255,.7);padding:3px 8px;border-radius:6px}
#osm a{color:#2a3b5c}
</style>
</head>
<body>
<canvas id="cv"></canvas><canvas id="plan" width="520" height="520" title="Lageplan (Norden oben)"></canvas>
<div id="osm">Gebäudedaten © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap-Mitwirkende</a> (ODbL)</div>
<div id="pn">
 <h1>Gebäude-Werkstatt</h1><div class="m">für 4Deep · Prototyp (Schaustück)</div>
 <label>Adresse oder Gebäudename</label>
 <div class="zeile"><input id="adr" placeholder="z. B. Platz der Republik 1, Berlin"><button id="such" style="flex:0 0 80px;margin-top:0">Suchen</button></div>
 <div class="m" style="margin-top:4px">Nur diese Eingabe geht an den Dienst Nominatim (OpenStreetMap).</div>
 <div id="treffer"></div>
 <label>Firmennummer (wie im CRM, z. B. CO000001)</label><input id="firma" placeholder="ordnet das Gebäude in 4Deep der Firma zu">
 <label>Name</label><input id="name">
 <div class="zeile"><div><label>Höhe gesamt (m)</label><input id="hoehe" type="number" min="1" max="999" step="0.5"></div>
  <div><label>Dach</label><select id="dach"><option value="">wie OpenStreetMap</option><option value="flach">flach</option><option value="zelt">Zeltdach</option><option value="kuppel">Kuppel</option></select></div></div>
 <div id="info"></div>
 <button id="spei" class="haupt" disabled>Beschreibung speichern …</button>
 <div id="st">Adresse eingeben und „Suchen“.</div>
</div>
<script src="three.min.js"></script>
<script>
'use strict';
const T=THREE,$=id=>document.getElementById(id);
// ---- gebaeude-gemeinsam (Version 63: Gebäude-Werkstatt und 4Deep, Text in beiden Dateien gleich halten; tests/test-gebaeude4d.js prüft das) ----
// Gebäudebeschreibung {format:'4deep-gebaeude',version:1,firma,name,adresse,lat,lon,teile:[{aussen:[[x,y],…],loecher:[[[x,y],…]],min,hoehe,dach,dachHoehe}],quelle,osm,erstellt}
// x nach Osten, y nach Norden, Meter, Ursprung Mitte des Grundrisses; hoehe = Oberkante inkl. Dach; dach: 'flach' | 'zelt' | 'kuppel'.
function gebaeudePruefen(G){if(!G||G.format!=='4deep-gebaeude'||!Array.isArray(G.teile)||!G.teile.length)return false;
 return G.teile.every(t=>Array.isArray(t.aussen)&&t.aussen.length>=3&&t.aussen.every(p=>Array.isArray(p)&&isFinite(p[0])&&isFinite(p[1]))&&isFinite(t.hoehe)&&t.hoehe>0&&t.hoehe<1000&&(!t.min||isFinite(t.min)&&t.min<t.hoehe))}
// Baut eine three.js-Gruppe in Metern (y nach oben, z = −Nord), Fuß auf y = 0. stil: {mat, kante} (Materialien) – Flächen und Kanten je Teil.
function gebaeudeBauen(G,stil){const grp=new T.Group(),V2=p=>new T.Vector2(p[0],p[1]);
 G.teile.forEach(t=>{const min=+t.min||0,dh=t.dach==='flach'||!t.dach?0:Math.max(0,Math.min(+t.dachHoehe||0,(t.hoehe-min)*.8)),wand=Math.max(.5,t.hoehe-min-dh);
  const sh=new T.Shape(t.aussen.map(V2));(t.loecher||[]).forEach(l=>{if(Array.isArray(l)&&l.length>=3)sh.holes.push(new T.Path(l.map(V2)))});
  const geo=new T.ExtrudeGeometry(sh,{depth:wand,bevelEnabled:false,curveSegments:1});geo.rotateX(-Math.PI/2);geo.translate(0,min,0);
  const add=g=>{const m=new T.Mesh(g,stil.mat);grp.add(m);const k=new T.LineSegments(new T.EdgesGeometry(g,25),stil.kante);grp.add(k)};add(geo);
  if(dh>0){const A=t.aussen,cx=A.reduce((s,p)=>s+p[0],0)/A.length,cy=A.reduce((s,p)=>s+p[1],0)/A.length,top=min+wand;
   if(t.dach==='kuppel'){let fl=0;for(let i=0;i<A.length;i++){const a=A[i],b=A[(i+1)%A.length];fl+=a[0]*b[1]-b[0]*a[1]}const r=Math.sqrt(Math.abs(fl)/2/Math.PI)*.8,g=new T.SphereGeometry(1,24,10,0,Math.PI*2,0,Math.PI/2);g.scale(r,dh,r);g.translate(cx,top,-cy);add(g)}
   else{const pos=[];for(let i=0;i<A.length;i++){const a=A[i],b=A[(i+1)%A.length];pos.push(a[0],top,-a[1],b[0],top,-b[1],cx,top+dh,-cy)}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.computeVertexNormals();
    const m=new T.Mesh(g,stil.mat);grp.add(m);const k=new T.LineSegments(new T.EdgesGeometry(g,25),stil.kante);grp.add(k)}}});
 return grp}
// ---- Ende gebaeude-gemeinsam ----

// ---------- OpenStreetMap (Nominatim) → Gebäudebeschreibung ----------
const NOMI='https://nominatim.openstreetmap.org/';
let letzteAnfrage=0;
async function nomi(pfad){const w=Math.max(0,letzteAnfrage+1100-Date.now());if(w)await new Promise(r=>setTimeout(r,w));letzteAnfrage=Date.now();   // höchstens 1 Anfrage je Sekunde (Nutzungsregeln)
 const r=await fetch(NOMI+pfad,{headers:{'Accept-Language':'de'}});if(!r.ok)throw new Error('Nominatim antwortet mit '+r.status);return r.json()}
const zahl=v=>{if(v==null)return NaN;const m=String(v).replace(',','.').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN};
function istGebaeude(h){const g=h&&h.geojson;return!!g&&(g.type==='Polygon'||g.type==='MultiPolygon')&&(h.category==='building'||!!(h.extratags&&h.extratags.building))}
// Douglas-Peucker (Toleranz in Metern), Ring ohne doppelten Endpunkt
function vereinfachen(P,tol){if(P.length<5)return P;const d=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;if(!l)return Math.hypot(p[0]-a[0],p[1]-a[1]);const t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)};
 const dp=(L)=>{let m=0,i0=0;for(let i=1;i<L.length-1;i++){const x=d(L[i],L[0],L[L.length-1]);if(x>m){m=x;i0=i}}return m>tol?dp(L.slice(0,i0+1)).slice(0,-1).concat(dp(L.slice(i0))):[L[0],L[L.length-1]]};
 const R=dp(P.concat([P[0]]));R.pop();return R.length>=3?R:P}
function nominatimZuGebaeude(h){const g=h.geojson,polys=g.type==='Polygon'?[g.coordinates]:g.coordinates,X=[];polys.forEach(p=>p[0].forEach(c=>X.push(c)));
 const lo=[Math.min(...X.map(c=>c[0])),Math.max(...X.map(c=>c[0]))],la=[Math.min(...X.map(c=>c[1])),Math.max(...X.map(c=>c[1]))],lon0=(lo[0]+lo[1])/2,lat0=(la[0]+la[1])/2,kx=111320*Math.cos(lat0*Math.PI/180),ky=110574;
 const ring=R=>{let P=R.map(c=>[(c[0]-lon0)*kx,(c[1]-lat0)*ky]);if(P.length>1&&P[0][0]===P[P.length-1][0]&&P[0][1]===P[P.length-1][1])P.pop();return vereinfachen(P,.8).map(p=>[Math.round(p[0]*10)/10,Math.round(p[1]*10)/10])};
 const t=h.extratags||{},lev=zahl(t['building:levels']),rl=zahl(t['roof:levels']);
 let hoehe=zahl(t.height);if(!(hoehe>0))hoehe=lev>0?lev*3.2+(rl>0?rl*2.8:0):12;
 let min=zahl(t.min_height);if(!(min>=0))min=zahl(t['building:min_level'])>0?zahl(t['building:min_level'])*3.2:0;if(min>=hoehe)min=0;
 const rs=String(t['roof:shape']||'flat').toLowerCase(),dach=/^(flat)$/.test(rs)?'flach':/dome|onion|round/.test(rs)?'kuppel':'zelt';
 const teile=polys.map(p=>{const aussen=ring(p[0]),loecher=p.slice(1).map(ring).filter(l=>l.length>=3);const xs=aussen.map(q=>q[0]),ys=aussen.map(q=>q[1]),ext=Math.min(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
  let dh=zahl(t['roof:height']);if(!(dh>0))dh=rl>0?rl*2.8:dach==='zelt'?Math.min(8,ext*.25):dach==='kuppel'?Math.min(15,ext*.3):0;return{aussen,loecher,min:Math.round(min*10)/10,hoehe:Math.round(hoehe*10)/10,dach,dachHoehe:Math.round(dh*10)/10}});
 return{format:'4deep-gebaeude',version:1,firma:'',name:h.name||String(h.display_name||'').split(',')[0],adresse:h.display_name||'',lat:+lat0.toFixed(6),lon:+lon0.toFixed(6),teile,
  quelle:'© OpenStreetMap-Mitwirkende, ODbL 1.0',osm:h.osm_type+'/'+h.osm_id,erstellt:new Date().toISOString().slice(0,10)}}
// Suche: Treffer mit Gebäudeumriss direkt, sonst Gebäude an der Stelle des Treffers (Rückwärtssuche, höchstens 2)
async function suchen(q){const opt='format=jsonv2&polygon_geojson=1&extratags=1';const H=await nomi('search?'+opt+'&limit=6&q='+encodeURIComponent(q)),K=[],ids=new Set(),neu=h=>{const k=h.osm_type+h.osm_id;if(istGebaeude(h)&&!ids.has(k)){ids.add(k);K.push(h)}};
 H.forEach(neu);let n=0;for(const h of H){if(istGebaeude(h)||n>=2)continue;n++;try{neu(await nomi('reverse?'+opt+'&zoom=18&lat='+h.lat+'&lon='+h.lon))}catch(_){}}return K}
// ---------- Bedienung ----------
const W={K:[],roh:null};
function st(t,f){$('st').textContent=t;$('st').className=f?'fehler':''}
function aktuell(){if(!W.roh)return null;const G=JSON.parse(JSON.stringify(W.roh)),H=parseFloat($('hoehe').value),mx=Math.max(...G.teile.map(t=>t.hoehe)),d=$('dach').value;
 if(H>0&&Math.abs(H-mx)>.01){const k=H/mx;G.teile.forEach(t=>{t.hoehe=Math.round(t.hoehe*k*10)/10;t.min=Math.round((t.min||0)*k*10)/10;t.dachHoehe=Math.round((t.dachHoehe||0)*k*10)/10})}
 if(d)G.teile.forEach(t=>{if(t.dach!==d){t.dach=d;if(d!=='flach'&&!(t.dachHoehe>0)){const xs=t.aussen.map(q=>q[0]),ys=t.aussen.map(q=>q[1]),ext=Math.min(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));t.dachHoehe=Math.round(Math.min(d==='kuppel'?15:8,ext*(d==='kuppel'?.3:.25))*10)/10}}});
 G.firma=$('firma').value.trim();G.name=$('name').value.trim()||G.name;return G}
function waehleKandidat(i){W.roh=nominatimZuGebaeude(W.K[i]);[...$('treffer').children].forEach((b,j)=>b.classList.toggle('an',j===i));
 $('name').value=W.roh.name;$('hoehe').value=Math.max(...W.roh.teile.map(t=>t.hoehe));$('dach').value='';$('spei').disabled=false;
 const t=W.K[i].extratags||{};st('Bitte prüfen: Umriss und Höhe. Höhe aus '+(t.height?'Höhenangabe':t['building:levels']?'Stockwerkzahl ('+t['building:levels']+')':'Annahme (keine Angabe in OpenStreetMap)')+'.');zeigen()}
$('such').onclick=async()=>{const q=$('adr').value.trim();if(!q){st('Bitte eine Adresse eingeben.',1);return}$('such').disabled=true;st('Suche …');$('treffer').innerHTML='';W.K=[];W.roh=null;$('spei').disabled=true;zeigen();
 try{W.K=await suchen(q);if(!W.K.length){st('Kein Gebäudeumriss gefunden. Adresse genauer angeben (Straße, Hausnummer, Ort) oder den Gebäudenamen.',1);return}
  W.K.forEach((h,i)=>{const b=document.createElement('button');b.innerHTML='<b>'+esc(h.name||h.display_name.split(',')[0])+'</b><br><span class="m">'+esc(h.display_name)+'</span>';b.onclick=()=>waehleKandidat(i);$('treffer').appendChild(b)});waehleKandidat(0)}
 catch(e){st('Suche fehlgeschlagen: '+e.message+' (Internetverbindung?)',1)}finally{$('such').disabled=false}};
$('adr').onkeydown=e=>{if(e.key==='Enter')$('such').click()};
['hoehe','dach','name','firma'].forEach(id=>{$(id).oninput=$(id).onchange=()=>zeigen()});
$('spei').onclick=()=>{const G=aktuell();if(!G||!gebaeudePruefen(G)){st('Beschreibung unvollständig.',1);return}if(!G.firma&&!confirm('Ohne Firmennummer ordnet 4Deep das Gebäude nur über den Namen oder die ausgewählte Firma zu. Trotzdem speichern?'))return;
 const n=(G.firma||G.name||'gebaeude').replace(/[^\wÄÖÜäöüß.-]+/g,'_')+'.4deep-gebaeude.json',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(G,null,1)],{type:'application/json'}));a.download=n;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);W.gespeichert={name:n,G};st('Gespeichert: '+n+' ('+JSON.stringify(G).length+' Byte). In 4Deep über „Datei laden“ oder im CRM-ZIP.')};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// ---------- Vorschau wie in 4Deep: Gebäude auf dem dunkelblauen Glasturm ----------
const cv=$('cv'),R=new T.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.outputEncoding=T.sRGBEncoding;
const S=new T.Scene(),CAM=new T.PerspectiveCamera(40,1,.1,2000);S.background=new T.Color(0xcfdcee);
S.add(new T.HemisphereLight(0xffffff,0x8ea2c0,.9));const sl=new T.DirectionalLight(0xffffff,.9);sl.position.set(-30,60,40);S.add(sl);
const STIL={mat:new T.MeshStandardMaterial({color:0xe9eef5,roughness:.4,metalness:.15,side:T.DoubleSide}),kante:new T.LineBasicMaterial({color:0x2f4f8a,transparent:true,opacity:.55})};   // wie GEB_STIL in 4Deep
const TW=10,TH=14,turm=new T.Mesh(new T.BoxGeometry(TW,TH,TW),new T.MeshPhysicalMaterial({color:0x0e2557,transparent:true,opacity:.72,roughness:.06,clearcoat:1,depthWrite:false}));turm.position.y=TH/2;S.add(turm);
turm.add(new T.LineSegments(new T.EdgesGeometry(turm.geometry),new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.95})));
const boden=new T.Mesh(new T.CircleGeometry(60,48),new T.MeshBasicMaterial({color:0xbccbe0}));boden.rotation.x=-Math.PI/2;S.add(boden);
let GG=null;const K={gier:.6,nick:.35,dist:48,ziel:new T.Vector3(0,TH,0)};
function zeigen(){if(GG){S.remove(GG);GG.traverse(o=>{if(o.geometry)o.geometry.dispose()});GG=null}const G=aktuell();$('info').innerHTML='';planMalen(G);if(!G)return;
 GG=gebaeudeBauen(G,STIL);const bx=new T.Box3().setFromObject(GG),sz=bx.getSize(new T.Vector3()),L=TW/2.5,k=Math.min(TW*.85/Math.max(1e-6,sz.x,sz.z),L*5/Math.max(1e-6,sz.y));   // gleiche Regel wie 4Deep (Turmbreite w, L)
 GG.scale.setScalar(k);GG.position.set(-(bx.min.x+bx.max.x)/2*k,TH,-(bx.min.z+bx.max.z)/2*k);S.add(GG);K.ziel.set(0,TH+sz.y*k*.4,0);K.dist=34+sz.y*k*1.2;
 const xs=G.teile.flatMap(t=>t.aussen.map(p=>p[0])),ys=G.teile.flatMap(t=>t.aussen.map(p=>p[1]));
 $('info').innerHTML='Grundriss '+Math.round(Math.max(...xs)-Math.min(...xs))+' × '+Math.round(Math.max(...ys)-Math.min(...ys))+' m · Höhe '+Math.max(...G.teile.map(t=>t.hoehe))+' m · '+G.teile.length+' Teil(e), '+G.teile.reduce((s,t)=>s+t.aussen.length,0)+' Eckpunkte'+(G.teile.some(t=>(t.loecher||[]).length)?' · mit Innenhof':'')+'<br>Quelle: '+esc(G.osm)}
function planMalen(G){const c=$('plan'),g=c.getContext('2d'),W2=c.width;g.clearRect(0,0,W2,W2);g.fillStyle='#2a3b5c';g.font='22px system-ui';
 if(!G){g.fillText('Lageplan',20,40);return}const P=G.teile.flatMap(t=>t.aussen),m=Math.max(...P.map(p=>Math.max(Math.abs(p[0]),Math.abs(p[1])))),k=(W2/2-50)/Math.max(1,m),pt=p=>[W2/2+p[0]*k,W2/2-p[1]*k];
 G.teile.forEach(t=>{g.beginPath();[t.aussen,...(t.loecher||[])].forEach(Rg=>{Rg.forEach((p,i)=>{const q=pt(p);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])});g.closePath()});g.fillStyle='rgba(47,99,200,.25)';g.fill('evenodd');g.strokeStyle='#2f4f8a';g.lineWidth=2;g.stroke()});
 const sm=[5,10,20,50,100,200].find(x=>x*k>60)||200;g.fillStyle='#2a3b5c';g.fillRect(20,W2-30,sm*k,5);g.fillText(sm+' m',20,W2-40);g.fillText('N ↑',W2-60,40)}
let zieh=null;cv.onpointerdown=e=>{zieh={x:e.clientX,y:e.clientY}};addEventListener('pointerup',()=>{zieh=null});
addEventListener('pointermove',e=>{if(!zieh)return;K.gier-=(e.clientX-zieh.x)*.008;K.nick=Math.max(.05,Math.min(1.3,K.nick+(e.clientY-zieh.y)*.006));zieh={x:e.clientX,y:e.clientY}});
cv.onwheel=e=>{e.preventDefault();K.dist=Math.max(12,Math.min(400,K.dist*Math.exp(e.deltaY*.001)))};
function rs(){R.setSize(innerWidth,innerHeight,false);CAM.aspect=innerWidth/innerHeight;CAM.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const t0=performance.now();(function bild(){requestAnimationFrame(bild);if(!zieh&&!navigator.webdriver)K.gier+=.002;const cp=Math.cos(K.nick);
 CAM.position.set(K.ziel.x+K.dist*cp*Math.sin(K.gier),K.ziel.y+K.dist*Math.sin(K.nick),K.ziel.z+K.dist*cp*Math.cos(K.gier));CAM.lookAt(K.ziel);R.render(S,CAM)})();
planMalen(null);
</script>
</body>
</html>
