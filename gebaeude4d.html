<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="4deep-werkstatt" content="1">
<title>Gebäude-Werkstatt · 4Deep</title>
<!-- Gebäude-Werkstatt (Version 63, Prototyp, Wunsch des Nutzers): Adresse eines Gebäudes von Hand eingeben, Umriss und Höhe aus OpenStreetMap (Dienst Nominatim),
     schematisches 3D-Gebäude prüfen und als kleine Beschreibung speichern (*.4deep-gebaeude.json). 4Deep zeigt sie in der Firmen-Skyline auf dem Turm der Firma.
     Nur die eingegebene Adresse geht an Nominatim, keine Firmenliste. Daten © OpenStreetMap-Mitwirkende (ODbL). Läuft auch lokal per Doppelklick (three.min.js im selben Ordner). -->
<style>
:root{--bg:#0d1424;--pn:#16213a;--rand:#2b3a5c;--tx:#e8eefb;--mu:#9aa8c4;--ak:#4b8cff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#cfdcee;font:14px system-ui,sans-serif;color:var(--tx)}
#pn{position:fixed;left:10px;top:10px;bottom:10px;width:330px;background:rgba(13,20,36,.94);border-radius:10px;padding:14px;overflow:auto;z-index:2}
#pn h1{font-size:17px;margin:0 0 2px}#pn .m{color:var(--mu);font-size:12px}
label{display:block;margin:12px 0 4px;color:var(--mu);font-size:12px}
input,select,button{width:100%;padding:7px;background:var(--pn);color:var(--tx);border:1px solid var(--rand);border-radius:6px;font:inherit}
button{cursor:pointer;margin-top:6px}button:hover{border-color:var(--ak)}button:disabled{opacity:.45;cursor:default}
button.haupt{background:#2f63c8;border-color:#2f63c8;font-weight:600}
.zeile{display:flex;gap:6px}.zeile>*{flex:1}
#treffer button{text-align:left;font-size:12.5px;line-height:1.35}#treffer button.an{border-color:var(--ak);background:#1d2f57}
#st{margin-top:12px;font-size:12.5px;color:var(--mu);min-height:1.4em}#st.fehler{color:#ff8a80}
#teile{max-height:34vh;overflow:auto}.teil{display:flex;gap:4px;align-items:center;margin-top:4px;font-size:12px}.teil span{flex:0 0 18px;color:var(--mu)}.teil input{flex:1;padding:4px}.teil select{flex:1.4;padding:4px}
#info{font-size:12.5px;color:var(--mu);margin-top:8px;line-height:1.45}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#plan{position:fixed;right:12px;top:12px;width:260px;height:260px;background:rgba(255,255,255,.85);border-radius:10px;border:1px solid #b9c8de}
#osm{position:fixed;right:12px;bottom:10px;font-size:12px;color:#2a3b5c;background:rgba(255,255,255,.7);padding:3px 8px;border-radius:6px}
#osm a{color:#2a3b5c}
</style>
</head>
<body>
<canvas id="cv"></canvas><canvas id="plan" width="520" height="520" title="Lageplan (Norden oben)"></canvas>
<div id="osm">Gebäudedaten © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap-Mitwirkende</a> (ODbL)</div>
<div id="pn">
 <h1>Gebäude-Werkstatt</h1><div class="m">für 4Deep · Prototyp (Schaustück)</div>
 <label>Adresse oder Gebäudename</label>
 <div class="zeile"><input id="adr" placeholder="z. B. Platz der Republik 1, Berlin"><button id="such" style="flex:0 0 80px;margin-top:0">Suchen</button></div>
 <div class="m" style="margin-top:4px">Nur diese Eingabe geht an den Dienst Nominatim (OpenStreetMap).</div>
 <div id="treffer"></div>
 <label>Firmennummer (wie im CRM, z. B. CO000001)</label><input id="firma" placeholder="ordnet das Gebäude in 4Deep der Firma zu">
 <label>Name</label><input id="name">
 <div class="zeile"><div><label>Höhe gesamt (m)</label><input id="hoehe" type="number" min="1" max="999" step="0.5"></div>
  <div><label>Dach</label><select id="dach"><option value="">wie OpenStreetMap</option><option value="flach">flach</option><option value="zelt">Zeltdach</option><option value="sattel">Satteldach</option><option value="pult">Pultdach</option><option value="kuppel">Kuppel</option></select></div></div>
 <label id="teilzeile" style="display:none;color:var(--tx);font-size:13px"><input type="checkbox" id="teilean" checked style="width:auto;margin-right:6px"><span id="teilan_t">Gebäudeteile verwenden</span></label>
 <div id="teile"></div>
 <div id="info"></div>
 <button id="spei" class="haupt" disabled>Beschreibung speichern …</button>
 <div id="st">Adresse eingeben und „Suchen“.</div>
</div>
<script src="three.min.js"></script>
<script>
'use strict';
const T=THREE,$=id=>document.getElementById(id);
// ---- gebaeude-gemeinsam (Version 63/64: Gebäude-Werkstatt und 4Deep, Text in beiden Dateien gleich halten; tests/test-gebaeude4d.js prüft das) ----
// Gebäudebeschreibung {format:'4deep-gebaeude',version:1,firma,name,adresse,lat,lon,teile:[{aussen:[[x,y],…],loecher:[[[x,y],…]],min,hoehe,dach,dachHoehe}],quelle,osm,erstellt}
// x nach Osten, y nach Norden, Meter, Ursprung Mitte des Grundrisses; min = Unterkante, hoehe = Oberkante inkl. Dach;
// dach: 'flach' | 'zelt' (Walm/Pyramide) | 'sattel' (First entlang der langen Seite) | 'pult' (steigt quer zur langen Seite) | 'kuppel'.
function gebaeudePruefen(G){if(!G||G.format!=='4deep-gebaeude'||!Array.isArray(G.teile)||!G.teile.length)return false;
 return G.teile.every(t=>Array.isArray(t.aussen)&&t.aussen.length>=3&&t.aussen.every(p=>Array.isArray(p)&&isFinite(p[0])&&isFinite(p[1]))&&isFinite(t.hoehe)&&t.hoehe>0&&t.hoehe<1000&&(!t.min||isFinite(t.min)&&t.min<t.hoehe))}
// kleinstes umschließendes Rechteck (Richtungen der Kanten): Achse u entlang der langen Seite, Ausdehnung, Flächenanteil des Umrisses
function gebaeudeRechteck(A){let best=null,fl=0;for(let i=0;i<A.length;i++){const a=A[i],b=A[(i+1)%A.length];fl+=a[0]*b[1]-b[0]*a[1];const l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(l<1e-6)continue;
  const ux=(b[0]-a[0])/l,uy=(b[1]-a[1])/l;let u0=1e9,u1=-1e9,v0=1e9,v1=-1e9;A.forEach(p=>{const u=p[0]*ux+p[1]*uy,v=-p[0]*uy+p[1]*ux;u0=Math.min(u0,u);u1=Math.max(u1,u);v0=Math.min(v0,v);v1=Math.max(v1,v)});
  const f=(u1-u0)*(v1-v0);if(!best||f<best.f)best={f,ux,uy,u0,u1,v0,v1}}
 if(!best)return null;if(best.v1-best.v0>best.u1-best.u0){const b=best;best={f:b.f,ux:-b.uy,uy:b.ux,u0:b.v0,u1:b.v1,v0:-b.u1,v1:-b.u0}}best.anteil=Math.abs(fl)/2/Math.max(1e-9,best.f);return best}
// Baut eine three.js-Gruppe in Metern (y nach oben, z = −Nord), Fuß auf y = 0. stil: {mat, kante} (Materialien) – Flächen und Kanten je Teil.
function gebaeudeBauen(G,stil){const grp=new T.Group(),V2=p=>new T.Vector2(p[0],p[1]);
 const add=g=>{const m=new T.Mesh(g,stil.mat);grp.add(m);grp.add(new T.LineSegments(new T.EdgesGeometry(g,25),stil.kante))};
 const dreiecke=pos=>{const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.computeVertexNormals();add(g)};
 G.teile.forEach(t=>{const A=t.aussen,min=+t.min||0,R=(t.dach==='sattel'||t.dach==='pult')?gebaeudeRechteck(A):null;
  let dach=t.dach||'flach';if((dach==='sattel'||dach==='pult')&&(!R||R.anteil<.8))dach='zelt';   // nicht rechteckig: Walmdach statt Sattel/Pult
  const dh=dach==='flach'?0:Math.max(0,Math.min(+t.dachHoehe||0,(t.hoehe-min)*.8)),wand=Math.max(.5,t.hoehe-min-dh),top=min+wand;
  const sh=new T.Shape(A.map(V2));(t.loecher||[]).forEach(l=>{if(Array.isArray(l)&&l.length>=3)sh.holes.push(new T.Path(l.map(V2)))});
  const geo=new T.ExtrudeGeometry(sh,{depth:wand,bevelEnabled:false,curveSegments:1});geo.rotateX(-Math.PI/2);geo.translate(0,min,0);add(geo);
  if(!(dh>0))return;
  const P=(x,y,h)=>[x,h,-y],cx=A.reduce((s,p)=>s+p[0],0)/A.length,cy=A.reduce((s,p)=>s+p[1],0)/A.length;
  if(dach==='kuppel'){const xs=A.map(p=>p[0]),ys=A.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),g=new T.SphereGeometry(1,28,12,0,Math.PI*2,0,Math.PI/2);   // Kuppel füllt den Umriss (Ellipse im Rechteck)
   g.scale((x1-x0)/2*.95,dh,(y1-y0)/2*.95);g.translate((x0+x1)/2,top,-(y0+y1)/2);add(g);return}
  if(dach==='sattel'){const w=(u,v)=>[u*R.ux-v*R.uy,u*R.uy+v*R.ux],vm=(R.v0+R.v1)/2,a=w(R.u0,R.v0),b=w(R.u1,R.v0),c=w(R.u1,R.v1),d=w(R.u0,R.v1),f0=w(R.u0,vm),f1=w(R.u1,vm);
   dreiecke([...P(...a,top),...P(...b,top),...P(...f1,top+dh),...P(...a,top),...P(...f1,top+dh),...P(...f0,top+dh),...P(...c,top),...P(...d,top),...P(...f0,top+dh),...P(...c,top),...P(...f0,top+dh),...P(...f1,top+dh),
    ...P(...b,top),...P(...c,top),...P(...f1,top+dh),...P(...d,top),...P(...a,top),...P(...f0,top+dh)]);return}
  if(dach==='pult'){const z=p=>top+dh*((-p[0]*R.uy+p[1]*R.ux)-R.v0)/Math.max(1e-6,R.v1-R.v0),pos=[],tri=T.ShapeUtils.triangulateShape(A.map(V2),[]);
   tri.forEach(q=>q.forEach(i=>pos.push(...P(A[i][0],A[i][1],z(A[i])))));
   for(let i=0;i<A.length;i++){const a=A[i],b=A[(i+1)%A.length];pos.push(...P(...a,top),...P(...b,top),...P(...b,z(b)),...P(...a,top),...P(...b,z(b)),...P(...a,z(a)))}dreiecke(pos);return}
  const pos=[];for(let i=0;i<A.length;i++){const a=A[i],b=A[(i+1)%A.length];pos.push(...P(...a,top),...P(...b,top),...P(cx,cy,top+dh))}dreiecke(pos)});
 return grp}
// ---- Ende gebaeude-gemeinsam ----

// ---------- OpenStreetMap (Nominatim) → Gebäudebeschreibung ----------
const NOMI='https://nominatim.openstreetmap.org/';
let letzteAnfrage=0;
async function nomi(pfad){const w=Math.max(0,letzteAnfrage+1100-Date.now());if(w)await new Promise(r=>setTimeout(r,w));letzteAnfrage=Date.now();   // höchstens 1 Anfrage je Sekunde (Nutzungsregeln)
 const r=await fetch(NOMI+pfad,{headers:{'Accept-Language':'de'}});if(!r.ok)throw new Error('Nominatim antwortet mit '+r.status);return r.json()}
const zahl=v=>{if(v==null)return NaN;const m=String(v).replace(',','.').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN};
function istGebaeude(h){const g=h&&h.geojson;return!!g&&(g.type==='Polygon'||g.type==='MultiPolygon')&&(h.category==='building'||!!(h.extratags&&h.extratags.building))}
// Douglas-Peucker (Toleranz in Metern), Ring ohne doppelten Endpunkt
function vereinfachen(P,tol){if(P.length<5)return P;const d=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;if(!l)return Math.hypot(p[0]-a[0],p[1]-a[1]);const t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)};
 const dp=(L)=>{let m=0,i0=0;for(let i=1;i<L.length-1;i++){const x=d(L[i],L[0],L[L.length-1]);if(x>m){m=x;i0=i}}return m>tol?dp(L.slice(0,i0+1)).slice(0,-1).concat(dp(L.slice(i0))):[L[0],L[L.length-1]]};
 const R=dp(P.concat([P[0]]));R.pop();return R.length>=3?R:P}
// Dachform aus OpenStreetMap (roof:shape) → flach / zelt / sattel / pult / kuppel; Dachhöhe: roof:height, sonst roof:levels × 2,8 m, sonst Annahme nach Form und Breite
function dachArt(t){const rs=String(t['roof:shape']||'flat').toLowerCase();return rs==='flat'?'flach':/dome|onion|round/.test(rs)?'kuppel':/^(gabled|saltbox|gambrel|round_gabled)$/.test(rs)?'sattel':/skillion|lean_to/.test(rs)?'pult':'zelt'}
function dachHoeheStd(dach,ext,t){const rh=zahl(t&&t['roof:height']),rl=zahl(t&&t['roof:levels']);if(rh>0)return rh;if(rl>0&&dach!=='flach')return rl*2.8;
 return dach==='flach'?0:dach==='kuppel'?Math.min(25,ext*.5):dach==='pult'?Math.min(5,ext*.2):Math.min(8,ext*.3)}
const breite=A=>{const xs=A.map(q=>q[0]),ys=A.map(q=>q[1]);return Math.min(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))};
const r1=x=>Math.round(x*10)/10;
function nominatimZuGebaeude(h){const g=h.geojson,polys=g.type==='Polygon'?[g.coordinates]:g.coordinates,X=[];polys.forEach(p=>p[0].forEach(c=>X.push(c)));
 const lo=[Math.min(...X.map(c=>c[0])),Math.max(...X.map(c=>c[0]))],la=[Math.min(...X.map(c=>c[1])),Math.max(...X.map(c=>c[1]))],lon0=(lo[0]+lo[1])/2,lat0=(la[0]+la[1])/2,kx=111320*Math.cos(lat0*Math.PI/180),ky=110574;
 const proj=c=>[(c[0]-lon0)*kx,(c[1]-lat0)*ky],ring=R=>{let P=R.map(proj);if(P.length>1&&P[0][0]===P[P.length-1][0]&&P[0][1]===P[P.length-1][1])P.pop();return vereinfachen(P,.8).map(p=>[r1(p[0]),r1(p[1])])};
 const t=h.extratags||{},lev=zahl(t['building:levels']),rl=zahl(t['roof:levels']);
 let hoehe=zahl(t.height);if(!(hoehe>0))hoehe=lev>0?lev*3.2+(rl>0?rl*2.8:0):12;
 let min=zahl(t.min_height);if(!(min>=0))min=zahl(t['building:min_level'])>0?zahl(t['building:min_level'])*3.2:0;if(min>=hoehe)min=0;
 const dach=dachArt(t),teile=polys.map(p=>{const aussen=ring(p[0]),loecher=p.slice(1).map(ring).filter(l=>l.length>=3);return{aussen,loecher,min:r1(min),hoehe:r1(hoehe),dach,dachHoehe:r1(dachHoeheStd(dach,breite(aussen),t))}});
 const G={format:'4deep-gebaeude',version:1,firma:'',name:h.name||String(h.display_name||'').split(',')[0],adresse:h.display_name||'',lat:+lat0.toFixed(6),lon:+lon0.toFixed(6),teile,
  quelle:'© OpenStreetMap-Mitwirkende, ODbL 1.0',osm:h.osm_type+'/'+h.osm_id,erstellt:new Date().toISOString().slice(0,10)};
 Object.defineProperty(G,'_r',{value:{lon0,lat0,kx,ky,proj,ringe:polys.map(p=>p[0].map(proj)),bbox:[la[0],lo[0],la[1],lo[1]]},enumerable:false});return G}
// ---------- Version 64: Gebäudeteile (building:part) über Overpass – Türme, Kuppeln, Dächer mit eigener Höhe ----------
// Nur ein Rechteck aus Koordinaten geht hinaus (keine Adresse). Zwei Server nacheinander (ausgelastet → nächster).
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
async function overpass(q){let f=null;for(const u of OVERPASS){try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});if(!r.ok)throw new Error(u.split('/')[2]+' antwortet mit '+r.status);return await r.json()}catch(e){f=e}}throw f||new Error('Overpass nicht erreichbar')}
function innen(p,R){let c=false;for(let i=0,j=R.length-1;i<R.length;j=i++){const a=R[i],b=R[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
const flaeche=A=>{let f=0;for(let i=0;i<A.length;i++){const a=A[i],b=A[(i+1)%A.length];f+=a[0]*b[1]-b[0]*a[1]}return Math.abs(f)/2};
// Wege einer Relation zu Ringen zusammensetzen (Endpunkte verbinden)
function ringeAus(wege){const offen=wege.map(w=>w.slice()),R=[],gl=(a,b)=>a.lat===b.lat&&a.lon===b.lon;while(offen.length){let r=offen.shift();let weiter=true;
  while(weiter&&!gl(r[0],r[r.length-1])){weiter=false;for(let i=0;i<offen.length;i++){const w=offen[i];if(gl(r[r.length-1],w[0])){r=r.concat(w.slice(1))}else if(gl(r[r.length-1],w[w.length-1])){r=r.concat(w.slice(0,-1).reverse())}else continue;offen.splice(i,1);weiter=true;break}}
  if(r.length>=4)R.push(r)}return R}
function osmTeile(js,G){const Rm=G._r,Hb=Math.max(...G.teile.map(t=>t.hoehe)),Fb=Rm.ringe.reduce((s,R)=>s+flaeche(R),0),out=[];
 const ring=g=>{let P=g.map(c=>Rm.proj([c.lon,c.lat]));if(P.length>1&&P[0][0]===P[P.length-1][0]&&P[0][1]===P[P.length-1][1])P.pop();return vereinfachen(P,.5).map(p=>[r1(p[0]),r1(p[1])])};
 (js.elements||[]).forEach(el=>{const t=el.tags||{};if(!t['building:part']||t['building:part']==='no')return;let polys=[];
  if(el.type==='way'&&el.geometry)polys=[{aussen:ring(el.geometry),loecher:[]}];
  else if(el.type==='relation'&&el.members){const W=r=>el.members.filter(m=>m.type==='way'&&m.role===r&&m.geometry).map(m=>m.geometry);const inn=ringeAus(W('inner')).map(ring);
   polys=ringeAus(W('outer')).map(o=>{const a=ring(o);return{aussen:a,loecher:inn.filter(l=>innen(l[0],a))}})}
  polys.forEach(P=>{const A=P.aussen;if(A.length<3)return;const c=[A.reduce((s,p)=>s+p[0],0)/A.length,A.reduce((s,p)=>s+p[1],0)/A.length];
   if(!Rm.ringe.some(R=>innen(c,R))||flaeche(A)>Fb*1.05)return;   // nur Teile innerhalb des gewählten Gebäudes
   const lev=zahl(t['building:levels']),ml=zahl(t['building:min_level']),rl=zahl(t['roof:levels']);let min=zahl(t.min_height);if(!(min>=0))min=ml>0?ml*3.2:0;
   let h=zahl(t.height);if(!(h>0))h=lev>0?min+lev*3.2+(rl>0?rl*2.8:0):Hb;if(!(h>min))return;const dach=dachArt(t);
   out.push({aussen:A,loecher:P.loecher,min:r1(min),hoehe:r1(h),dach,dachHoehe:r1(dachHoeheStd(dach,breite(A),t)),_osm:el.type+'/'+el.id})})});
 return out.sort((a,b)=>a.min-b.min||b.hoehe-a.hoehe)}
async function teileHolen(G){const b=G._r.bbox,q='[out:json][timeout:25];(way["building:part"]('+b.map(x=>x.toFixed(6)).join(',')+');relation["building:part"]('+b.map(x=>x.toFixed(6)).join(',')+'););out tags geom;';return osmTeile(await overpass(q),G)}
// Suche: Treffer mit Gebäudeumriss direkt, sonst Gebäude an der Stelle des Treffers (Rückwärtssuche, höchstens 2)
async function suchen(q){const opt='format=jsonv2&polygon_geojson=1&extratags=1';const H=await nomi('search?'+opt+'&limit=6&q='+encodeURIComponent(q)),K=[],ids=new Set(),neu=h=>{const k=h.osm_type+h.osm_id;if(istGebaeude(h)&&!ids.has(k)){ids.add(k);K.push(h)}};
 H.forEach(neu);let n=0;for(const h of H){if(istGebaeude(h)||n>=2)continue;n++;try{neu(await nomi('reverse?'+opt+'&zoom=18&lat='+h.lat+'&lon='+h.lon))}catch(_){}}return K}
// ---------- Bedienung ----------
const W={K:[],roh:null,teile:[],nr:0};
function st(t,f){$('st').textContent=t;$('st').className=f?'fehler':''}
const DACH={flach:'flach',zelt:'Zeltdach',sattel:'Satteldach',pult:'Pultdach',kuppel:'Kuppel'};
function mitTeilen(){return W.teile.length>0&&$('teilean').checked}
function aktuell(){if(!W.roh)return null;const G=JSON.parse(JSON.stringify(W.roh));if(mitTeilen())G.teile=JSON.parse(JSON.stringify(W.teile)).map(t=>{delete t._osm;return t});
