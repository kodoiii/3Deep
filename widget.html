<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:widget="http://www.netvibes.com/ns/">
<head>
  <title>3Deep</title>
  <meta name="author" content="3Deep" />
  <meta name="description" content="Bookmark und Produktstruktur als 3D-Datenraum" />
  <meta name="autoRefresh" content="0" />
  <script type="text/javascript" src="//uwa.netvibes.com/lib/c/UWA/js/UWA_Standalone_Alone.js"></script>
  <script type="text/javascript">//<![CDATA[
    var DreiDeepLader = {
      base: 'https://kodoiii.github.io/3Deep/',
      version: '34',
      fertig: false,
      onLoad: function () {
        if (DreiDeepLader.fertig) { return; }
        DreiDeepLader.fertig = true;
        widget.body.innerHTML = '<p>3Deep wird geladen ...</p>';
        var script = document.createElement('script');
        script.charset = 'utf-8';
        script.src = DreiDeepLader.base + 'adapter.js?v=' + DreiDeepLader.version;
        script.onload = function () { window.__3deep.start(true, DreiDeepLader.base); };
        script.onerror = function () {
          widget.body.innerHTML = '<p>adapter.js konnte nicht geladen werden von ' + DreiDeepLader.base + '</p>';
        };
        document.getElementsByTagName('head')[0].appendChild(script);
      }
    };
    widget.addEvent('onLoad', DreiDeepLader.onLoad);
  //]]></script>
</head>
<body>
  <p>3Deep</p>
</body>
</html>
