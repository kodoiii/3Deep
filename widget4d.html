<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:widget="http://www.netvibes.com/ns/">
<head>
  <title>4Deep</title>
  <meta name="author" content="3Deep" />
  <meta name="description" content="4Deep (Machbarkeitsstudie WebGL): Bookmark und Produktstruktur als 3D-Datenraum mit Zeit" />
  <meta name="autoRefresh" content="0" />
  <widget:preferences>
    <widget:preference name="ViewerUrl" type="text" label="Adresse der Darstellung" defaultValue="https://kodoiii.github.io/3Deep/datenraum4d.html" />
  </widget:preferences>
  <script type="text/javascript" src="//uwa.netvibes.com/lib/c/UWA/js/UWA_Standalone_Alone.js"></script>
  <script type="text/javascript">//<![CDATA[
    var DreiDeepLader = {
      base: 'https://kodoiii.github.io/3Deep/',
      version: '50',
      fertig: false,
      onLoad: function () {
        if (DreiDeepLader.fertig) { return; }
        DreiDeepLader.fertig = true;
        var gv = widget.getValue;
        widget.getValue = function (k) { var v = gv.apply(widget, arguments); return (k === 'ViewerUrl' && !v) ? DreiDeepLader.base + 'datenraum4d.html' : v; };
        widget.body.innerHTML = '<p>4Deep wird geladen ...</p>';
        var script = document.createElement('script');
        script.charset = 'utf-8';
        script.src = DreiDeepLader.base + 'adapter.js?v=' + DreiDeepLader.version;
        script.onload = function () { window.__3deep.start(true, DreiDeepLader.base); };
        script.onerror = function () {
          widget.body.innerHTML = '<p>adapter.js konnte nicht geladen werden von ' + DreiDeepLader.base + '</p>';
        };
        document.getElementsByTagName('head')[0].appendChild(script);
      }
    };
    widget.addEvent('onLoad', DreiDeepLader.onLoad);
  //]]></script>
</head>
<body>
  <p>4Deep</p>
</body>
</html>
